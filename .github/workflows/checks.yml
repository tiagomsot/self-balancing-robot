name: Controller and analysis checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test the shared C++ controller
        run: bash build_cpp.sh test
      - name: Run Python regression checks
        run: python -m unittest discover -s tests -v
